<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>Stellaris Tech Tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap"
    />
    <style>
      /* Tokens match client/src/theme.ts; keep the two in step. */
      :root {
        color-scheme: dark;
        --ink: #eef0f2;
        --dim: #8f8b94;
        --bg: #141414;
        --panel: #1b1b1e;
        --line: #38363c;
        --rare: #a07be0;
        --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      /* One visible focus ring for every control reached by keyboard. */
      :focus-visible { outline: 2px solid var(--rare); outline-offset: 2px; }
      #search input:focus-visible { outline: none; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #tree {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #tree:active { cursor: grabbing; }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 12px;
        background: rgba(10, 12, 16, 0.85);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        font-size: 12px;
        pointer-events: none;
        max-width: calc(100vw - 24px);
      }

      #toolbar {
        position: fixed;
        left: 12px;
        top: 38px;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
        max-width: calc(100vw - 24px);
        font: 600 12px var(--display);
      }
      /* Keep the toolbar clear of the open detail panel on wide screens. */
      @media (min-width: 701px) {
        body:has(#panel:not([hidden])) #toolbar { max-width: calc(100vw - 456px); }
      }
      #profile,
      #search,
      #guide-button {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 6px;
        background: rgba(10, 12, 16, 0.85);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      #search { position: relative; }
      #guide-button {
        height: 42px;
        padding: 0 14px;
        color: var(--ink);
        font: inherit;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      #guide-button:hover { border-color: var(--rare); }
      #guide-button span { color: var(--rare); margin-right: 6px; }
      #isolation {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px 6px 12px;
        background: #2a2238;
        border: 1px solid var(--rare);
        border-radius: 6px;
        color: var(--ink);
      }
      #isolation[hidden] { display: none; }
      #isolation span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #isolation button {
        flex: none;
        min-height: 28px;
        padding: 4px 14px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
      }
      #isolation button:hover { border-color: var(--rare); }
      #search input {
        width: 240px;
        height: 28px;
        padding: 0 10px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
        letter-spacing: 0.02em;
      }
      #search input:focus { outline: none; border-color: var(--rare); }
      #search .results {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        width: 360px;
        max-width: calc(100vw - 24px);
        margin: 0;
        padding: 4px;
        list-style: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #search .results li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      #search .results li.active { background: #2a2238; }
      #search .results li.unavailable { opacity: 0.45; cursor: default; }
      #search .results li.empty { color: var(--dim); cursor: default; font-weight: 500; }
      #search .results .icon {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 3px;
        background-repeat: no-repeat;
        background-color: #111;
      }
      #search .results .text { display: flex; flex-direction: column; min-width: 0; }
      #search .results .name { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #search .results .meta { color: var(--dim); font-weight: 500; font-size: 11px; }
      #profile select,
      #profile .toggle {
        min-height: 28px;
        padding: 4px 14px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
        letter-spacing: 0.04em;
        white-space: nowrap;
        cursor: pointer;
      }
      #profile .toggle { color: var(--dim); }
      #profile .toggle.on { color: var(--ink); border-color: var(--rare); background: #2a2238; }
      #profile .toggle:disabled { opacity: 0.35; cursor: not-allowed; }
      #profile .note { padding: 0 6px; color: var(--dim); font-weight: 500; }

      #help {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px 12px;
        background: rgba(10, 12, 16, 0.85);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        font-size: 12px;
        pointer-events: none;
      }
      #help kbd {
        background: #1b222c;
        border-radius: 3px;
        padding: 1px 5px;
        font: inherit;
        color: var(--ink);
      }

      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: min(420px, 100vw);
        height: 100%;
        overflow-y: auto;
        padding: 20px 22px 40px;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #panel[hidden] { display: none; }
      /* Stays in view while the panel scrolls, so Hide and Close are always in reach. */
      #panel .head {
        position: sticky;
        top: -20px;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: -20px -22px 0;
        padding: 16px 16px 6px 22px;
        background: var(--panel);
      }
      #panel h2 { flex: 1; min-width: 0; margin: 4px 0; font: 600 20px/1.25 var(--display); }
      #panel.collapsed .head { cursor: pointer; margin-bottom: -20px; padding-bottom: 16px; }
      #panel.collapsed h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #panel.collapsed .body { display: none; }
      #panel h3 {
        margin: 20px 0 6px;
        font: 600 12px var(--display);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--dim);
      }
      #panel .meta { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
      #panel .desc { white-space: pre-wrap; }
      #panel ul { margin: 0; padding-left: 18px; }
      #panel li { margin: 2px 0; }
      #panel .none { text-transform: none; letter-spacing: 0; opacity: 0.7; }
      #panel .key {
        margin-top: 24px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #5c6675;
      }
      #panel .flags { margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; }
      #panel .flag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--dim);
      }
      #panel .flag.danger { color: #e05c5c; border-color: #5b2424; }
      #panel .flag.rare { color: var(--rare); border-color: #3d2f5b; }
      #panel .flag.event { color: var(--rare); border-color: #3d2f5b; }
      #panel .flag.perk { color: var(--rare); border-color: var(--rare); }

      #panel ul.perks { list-style: none; padding-left: 0; }
      /* One complete way in per line. The bar keeps a line that wraps reading
         as one unit rather than as two ways in. */
      #panel ul.perks li {
        margin: 4px 0;
        padding: 2px 0 2px 10px;
        border-left: 2px solid var(--line);
        line-height: 26px;
      }
      #panel ul.perks .perk-icon {
        display: inline-block;
        flex: none;
        background-repeat: no-repeat;
        border-radius: 4px;
        vertical-align: middle;
      }
      #panel ul.perks em { color: var(--dim); font-style: normal; margin: 0 4px; vertical-align: middle; }
      #panel ul.perks .condition {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        vertical-align: middle;
      }
      #panel ul.perks .context { color: var(--dim); font-size: 12px; }
      #panel ul.perks li.or {
        margin: 0;
        padding: 0;
        border: 0;
        line-height: 18px;
        font: 600 11px var(--display);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #panel .gate-note {
        margin: 6px 0 0;
        color: var(--dim);
        font-size: 12px;
      }
      #panel .close,
      #panel .collapse {
        flex: none;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 22px;
        line-height: 1;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        cursor: pointer;
      }
      #panel .collapse svg { transition: transform 120ms ease-out; }
      /* Beside the tree the panel folds up; as a phone's sheet it folds down. */
      #panel .collapse svg { transform: rotate(180deg); }
      #panel.collapsed .collapse svg { transform: none; }
      #panel .close:hover,
      #panel .collapse:hover { color: var(--ink); }
      #panel.collapsed { height: auto; width: min(420px, 100vw); padding-bottom: 20px; }
      #panel .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
      #panel .actions button {
        min-height: 32px;
        padding: 4px 16px;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: 600 12px var(--display);
        letter-spacing: 0.04em;
        white-space: nowrap;
        cursor: pointer;
      }
      #panel .actions button:hover { border-color: var(--rare); }
      #panel .actions .done { color: var(--dim); font-size: 12px; align-self: center; }
      #panel ul.routes .route { color: var(--ink); }
      #panel ul.routes .names { color: var(--dim); }
      #panel ul.routes details.more { color: var(--dim); }
      #panel ul.routes details.more summary {
        width: fit-content;
        color: var(--rare);
        cursor: pointer;
        font-size: 13px;
      }
      #panel ul.costs { list-style: none; padding-left: 0; }
      #panel ul.costs .factor {
        display: inline-block;
        min-width: 48px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      #panel ul.costs .cheaper { color: #63c78a; }
      #panel ul.costs .dearer { color: #e0a458; }

      #guide {
        width: min(680px, calc(100vw - 24px));
        max-height: min(86vh, 900px);
        padding: 0;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      }
      #guide[open] { display: flex; flex-direction: column; }
      #guide::backdrop { background: rgba(0, 0, 0, 0.55); }
      #guide header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--line);
      }
      #guide h2 { margin: 0; font: 600 20px/1.25 var(--display); }
      #guide .close {
        width: 32px;
        height: 32px;
        font-size: 22px;
        line-height: 1;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        cursor: pointer;
      }
      #guide .close:hover { color: var(--ink); }
      #guide .body { overflow-y: auto; padding: 4px 20px 20px; }
      #guide h3 {
        margin: 18px 0 8px;
        font: 600 12px var(--display);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--dim);
      }
      #guide ul { margin: 0; padding-left: 18px; }
      #guide li { margin: 6px 0; }
      #guide p { margin: 10px 0 0; }
      #guide b { font-weight: 600; }
      #guide ul.legend, #guide ul.keys { list-style: none; padding-left: 0; }
      #guide ul.legend li { display: flex; align-items: flex-start; gap: 12px; }
      #guide .sample { flex: none; width: 46px; margin-top: 1px; }
      #guide span.sample {
        font: 600 11px var(--display);
        text-align: center;
        line-height: 24px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: #212125;
      }
      #guide span.sample.tag { color: var(--rare); }
      #guide span.sample.muted { color: var(--dim); }
      #guide span.sample.mono { color: var(--dim); font-size: 10px; }
      #guide .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        vertical-align: baseline;
      }
      #guide ul.keys li {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
        gap: 12px;
        padding: 4px 0;
        margin: 0;
        border-bottom: 1px solid #262529;
      }
      #guide ul.keys li > span:first-child { color: var(--dim); }
      #guide kbd {
        background: #1b222c;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 5px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink);
      }
      @media (max-width: 520px) {
        #guide ul.keys li { grid-template-columns: 1fr; gap: 0; }
      }

      /* Fingers need more room than a pointer. */
      @media (pointer: coarse) {
        #isolation button, #profile select, #profile .toggle { min-height: 36px; }
        #panel .actions button { min-height: 40px; }
        #panel .close, #panel .collapse { width: 40px; height: 40px; }
      }
      @media (max-width: 700px) {
        #panel { width: 100vw; top: auto; bottom: 0; height: 70vh; border-left: 0; border-top: 1px solid var(--line); }
        #panel.collapsed { width: 100vw; height: auto; }
        #panel .collapse svg { transform: none; }
        #panel.collapsed .collapse svg { transform: rotate(180deg); }
        #help { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="tree"></canvas>
    <div id="toolbar">
      <button id="guide-button" type="button" aria-haspopup="dialog"><span aria-hidden="true">?</span>Guide</button>
      <div id="search" role="search"></div>
      <div id="profile" role="group" aria-label="Empire profile"></div>
      <div id="isolation" role="status" hidden></div>
    </div>
    <div id="status">Loading…</div>
    <div id="help">
      hover: highlight &middot; click: pin &middot; middle-click: isolate &middot;
      <kbd>/</kbd> search &middot; <kbd>F</kbd> fit &middot; <kbd>Esc</kbd> clear &middot; <kbd>?</kbd> guide
    </div>
    <aside id="panel" hidden></aside>
    <dialog id="guide"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
