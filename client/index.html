<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>Stellaris Tech Tree</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ecf2;
        --dim: #8e99a8;
        --bg: #0a0c10;
        --panel: #11151c;
        --line: #222a36;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #tree {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #tree:active { cursor: grabbing; }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 12px;
        background: rgba(10, 12, 16, 0.85);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        font-size: 12px;
        pointer-events: none;
        max-width: calc(100vw - 24px);
      }

      #help {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px 12px;
        background: rgba(10, 12, 16, 0.85);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        font-size: 12px;
        pointer-events: none;
      }
      #help kbd {
        background: #1b222c;
        border-radius: 3px;
        padding: 1px 5px;
        font: inherit;
        color: var(--ink);
      }

      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: min(420px, 100vw);
        height: 100%;
        overflow-y: auto;
        padding: 20px 22px 40px;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #panel[hidden] { display: none; }
      #panel h2 { margin: 0 8px 4px 0; font-size: 20px; line-height: 1.25; }
      #panel h3 {
        margin: 20px 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
      }
      #panel .meta { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
      #panel .desc { white-space: pre-wrap; }
      #panel ul { margin: 0; padding-left: 18px; }
      #panel li { margin: 2px 0; }
      #panel .none { text-transform: none; letter-spacing: 0; opacity: 0.7; }
      #panel .key {
        margin-top: 24px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #5c6675;
      }
      #panel .flags { margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; }
      #panel .flag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--dim);
      }
      #panel .flag.danger { color: #ff5f5f; border-color: #5b2020; }
      #panel .flag.rare { color: #c9a227; border-color: #4d3f12; }
      #panel .flag.event { color: #9b7fe0; border-color: #3b2f5b; }
      #panel .flag.perk { color: #4bb3c9; border-color: #1d4954; }

      #panel ul.perks { list-style: none; padding-left: 0; }
      #panel ul.perks li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      #panel ul.perks .perk-icon {
        display: inline-block;
        flex: none;
        background-repeat: no-repeat;
        border-radius: 4px;
        vertical-align: middle;
      }
      #panel ul.perks em { color: var(--dim); font-style: normal; }
      #panel ul.perks .note {
        flex-basis: 100%;
        color: var(--dim);
        font-size: 12px;
      }
      #panel .close {
        position: absolute;
        top: 14px;
        right: 16px;
        width: 32px;
        height: 32px;
        font-size: 22px;
        line-height: 1;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        cursor: pointer;
      }
      #panel .close:hover { color: var(--ink); }

      @media (max-width: 700px) {
        #panel { width: 100vw; top: auto; bottom: 0; height: 70vh; border-left: 0; border-top: 1px solid var(--line); }
        #help { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="tree"></canvas>
    <div id="status">Loading…</div>
    <div id="help">
      hover: highlight &middot; click: pin &middot; middle-click: isolate &middot;
      <kbd>F</kbd> fit &middot; <kbd>Esc</kbd> clear
    </div>
    <aside id="panel" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
