# Crisis rows.
#
# Gigastructures' crises each have a self-contained research chain, and a player
# facing one wants to see it in a single band rather than scattered across three
# research areas. Nothing in the technology data says which crisis a technology
# belongs to, so membership is declared here where it can be read and corrected.
#
# Names come from Gigastructures' own `giga_category_*` localisation keys, the
# ones it uses for situation log headings.
#
# `colour` is the row's colour on the page; a row without one is grey.
#
# Rules are tried strongest first: explicit `keys`, then `source_files`, then
# `categories`, then `key_prefixes`, then `reachable_from`. A technology joins
# the FIRST crisis that matches, so order below resolves any overlap.
#
# The build fails if a rule names a technology or file that does not exist,
# which is what catches a stale rule after a mod update.

[[crisis]]
key = "katzen"
name = "Katzenartig Imperium"
colour = "#d8bd5a"
source_files = ["giga_10_katzen.txt"]
keys = ["tech_katzen_atomic_munitions"]
note = """Confident. Gigastructures keeps the whole chain in one file.
tech_katzen_atomic_munitions sits in the shared special-project file instead,
so it is listed explicitly."""

[[crisis]]
key = "sirens"
name = "Sirenalia"
colour = "#b07be0"
source_files = ["giga_18_eawaf.txt"]
note = """Confident. EAWAF is Gigastructures' internal name for the Sirenalia
chain; the disenchanter technologies are all here."""

[[crisis]]
key = "aeternum"
name = "Aeternum"
colour = "#e07fae"
source_files = ["giga_11_aeternum.txt"]
note = """Confident, but only two technologies so far. Expected to grow.
giga_tech_aeternite_weaponry is disabled upstream (potential always = no) and
has no card."""

[[crisis]]
key = "blokkats"
name = "The Blokkats"
colour = "#52d97e"
source_files = ["giga_13_blokkat.txt"]
categories = ["blokkats", "blokkatsprotocols"]
note = """Confident. The file and the dedicated categories agree.
Note this is the one group that already spanned all three research areas, so a
single crisis row is strictly more honest than the three category rows it
replaces."""

[[crisis]]
key = "compound"
name = "The Compound"
# Deep violet, from the hue of Stellaris' own dark matter resource icon,
# lifted enough to stay legible as label text.
colour = "#6e4ad8"
reachable_from = ["tech_qnm_utilities"]
note = """Reviewed 2026-09-13: kept as is. See docs/crisis-rows.md.

tech_qnm_utilities is weight 0, so it is granted by event rather than
researched, and everything downstream of it is the negative mass weapon set.
That is 15 technologies including the root.

The uncertainty is that Gigastructures treats The Compound and E.H.O.F. as two
separate event chains (compound_crisis_chain and ehof_system_list both appear in
giga_event_chains.txt with different situation_log_category values), yet their
technologies share files giga_08_ehof_components.txt and
giga_09_ehof_other.txt. Eight `tech_sm_*` Sentient Metal technologies are
reachable from tech_qnm_utilities and so land here, while five more `tech_sm_*`
and five `tech_qnm_*` component technologies gate on tech_ehof_sentient_tier_N
instead and do not.

Splitting a coherent-looking family like that may well be wrong. The candidates
are listed in the build report."""

# Technologies the build report lists under "Needs review" when no crisis row
# takes them: close to a crisis family, but not yet classified.
[[review]]
source_files = ["giga_08_ehof_components.txt", "giga_09_ehof_other.txt"]
reason = "E.H.O.F. / Compound family"

[[review]]
key_prefixes = ["tech_qnm_", "tech_sm_", "tech_nm_"]
reason = "negative mass / sentient metal naming"
